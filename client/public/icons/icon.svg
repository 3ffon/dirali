<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-opacity="0.18"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="512" height="512" rx="112" ry="112" fill="url(#bgGrad)"/>

  <!-- Building -->
  <g filter="url(#shadow)">
    <!-- Roof -->
    <path d="M 256 108 L 408 232 L 104 232 Z" fill="#FFFFFF"/>
    <!-- Building body -->
    <rect x="128" y="232" width="256" height="184" rx="8" fill="#FFFFFF"/>

    <!-- Windows row 1 -->
    <rect x="160" y="260" width="44" height="44" rx="6" fill="#4F46E5"/>
    <rect x="234" y="260" width="44" height="44" rx="6" fill="#4F46E5"/>
    <rect x="308" y="260" width="44" height="44" rx="6" fill="#4F46E5"/>

    <!-- Door / large checkmark area -->
    <rect x="200" y="328" width="112" height="88" rx="8" fill="#7C3AED"/>
    <!-- Checkmark inside door -->
    <path d="M 222 372 L 246 396 L 290 348"
          stroke="#FFFFFF" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </g>
</svg>